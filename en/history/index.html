        <script>
    (function () {
        var labelsNode = document.getElementById('status-labels');
        var labels = labelsNode ? JSON.parse(labelsNode.textContent) : null;
        var lang = document.documentElement.lang || 'el';
        var severity = { unknown: 0, operational: 0, maintenance: 1, degraded: 2, partial: 3, outage: 4 };
        var dayOrder = { none: 0, quiet: 0, ok: 0, future: 0, maintenance: 1, dip: 2, degraded: 3, outage: 4 };
        var thresholds = {"ok":99.5,"dip":97,"degraded":90};
        var staleAfter = 30 * 60 * 1000;
        var percent = new Intl.NumberFormat(lang, { maximumFractionDigits: 2 });
        var relative = new Intl.RelativeTimeFormat(lang, { numeric: 'auto' });

        function worse(a, b) { return (severity[b] || 0) > (severity[a] || 0) ? b : a; }
        function raiseDay(a, b) { return (dayOrder[b] || 0) > (dayOrder[a] || 0) ? b : a; }

        function ago(iso) {
            var seconds = Math.round((new Date(iso).getTime() - Date.now()) / 1000);
            var minutes = Math.round(seconds / 60);
            if (Math.abs(minutes) < 1) { return relative.format(0, 'minute'); }
            if (Math.abs(minutes) < 60) { return relative.format(minutes, 'minute'); }
            return relative.format(Math.round(minutes / 60), 'hour');
        }

        function setState(pill, state) {
            pill.querySelectorAll('[data-state]').forEach(function (node) { node.setAttribute('data-state', state); });
            pill.setAttribute('data-state', state);
            var label = pill.querySelector('[data-state-label]');
            if (label && labels.states[state]) { label.textContent = labels.states[state]; }
        }

        function level(counts) {
            if (!counts || !counts[1]) { return 'none'; }
            var uptime = 100 * counts[0] / counts[1];
            if (uptime >= thresholds.ok) { return 'ok'; }
            if (uptime >= thresholds.dip) { return 'dip'; }
            if (uptime >= thresholds.degraded) { return 'degraded'; }
            return 'outage';
        }

        function apply(checks) {
            var fresh = checks.generated_at && (Date.now() - new Date(checks.generated_at).getTime()) < staleAfter;
            var overall = 'operational';

            document.querySelectorAll('[data-component]').forEach(function (row) {
                var key = row.getAttribute('data-component');
                var declared = row.getAttribute('data-declared') || 'operational';
                var grid = row.querySelector('[data-grid]');
                var checked = grid && grid.getAttribute('data-checked') === 'true';
                var state = row.querySelector('[data-state-pill]').getAttribute('data-state');

                if (checked) {
                    var latest = checks.components && checks.components[key];
                    var measured = fresh && latest ? (latest.ok ? 'operational' : 'outage') : null;
                    state = measured ? worse(declared, measured) : (declared !== 'operational' ? declared : 'unknown');
                    setState(row.querySelector('[data-state-pill]'), state);

                    var days = (checks.days && checks.days[key]) || {};
                    var good = 0, total = 0;

                    grid.querySelectorAll('[data-day]').forEach(function (cell) {
                        if (cell.getAttribute('data-level') === 'future') { return; }
                        var counts = days[cell.getAttribute('data-day')];
                        if (counts) { good += counts[0]; total += counts[1]; }
                        cell.setAttribute('data-level', raiseDay(level(counts), cell.getAttribute('data-declared') || 'none'));
                    });

                    var uptime = row.querySelector('[data-uptime]');
                    if (uptime && total > 0) {
                        uptime.textContent = labels.uptime.replace(':percent', percent.format(100 * good / total));
                    }
                }

                overall = worse(overall, state === 'unknown' ? 'operational' : state);
            });

            var anyKnown = Array.prototype.some.call(document.querySelectorAll('[data-state-pill]'), function (pill) {
                return pill.getAttribute('data-state') !== 'unknown';
            });

            var banner = document.querySelector('[data-overall]');
            if (banner) {
                var value = anyKnown ? overall : 'unknown';
                banner.setAttribute('data-overall', value);
                banner.querySelector('[data-overall-text]').textContent = labels.overall[value];
            }

            if (fresh) {
                var stamp = document.querySelector('[data-checked-at]');
                if (stamp) {
                    stamp.setAttribute('data-checked-at', checks.generated_at);
                    stamp.textContent = labels.checked.replace(':time', ago(checks.generated_at));
                }
            }
        }

        function refresh() {
            if (!labels || !labels.checksUrl) { return; }
            fetch(labels.checksUrl, { cache: 'no-store' })
                .then(function (response) { return response.ok ? response.json() : null; })
                .then(function (checks) { if (checks) { apply(checks); } })
                .catch(function () { /* the published page stands */ });
        }

        if (labels) {
            var stamp = document.querySelector('[data-checked-at]');
            if (stamp && stamp.getAttribute('data-checked-at')) {
                stamp.textContent = labels.checked.replace(':time', ago(stamp.getAttribute('data-checked-at')));
            }
            refresh();
            window.setInterval(refresh, 60 * 1000);
        }

        document.querySelectorAll('[data-copy]').forEach(function (button) {
            if (!navigator.clipboard) { return; }
            button.hidden = false;
            button.addEventListener('click', function () {
                navigator.clipboard.writeText(button.getAttribute('data-copy')).then(function () {
                    var label = button.querySelector('[data-copy-label]');
                    var before = label.textContent;
                    label.textContent = button.getAttribute('data-copied');
                    window.setTimeout(function () { label.textContent = before; }, 2000);
                });
            });
        });
    })();
</script>
